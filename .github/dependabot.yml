# To get started with Dependabot version updates, you'll need to specify, which
# package ecosystems to update and where the package manifests are located.
# Documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Review requests come from .github/CODEOWNERS: Dependabot removed the `reviewers` option.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    labels:
      - "gradle"
      - "dependencies"
    # Explicit cap so a backlog can never silently saturate the default limit (5)
    # and stall all new updates. Grouping keeps the real PR
    # count well below this.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 30
    # The published stdlib is the consumer floor (catalog `kotlinCoreLibraries`): JVM/Android artefacts stay usable
    # from Kotlin 2.3. A minor bump would raise that floor, which is a maintainer decision, never an update; patches
    # within the floor still arrive.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Coupled toolchains land as one reviewable PR instead of fanning out into
    # several that can't merge atomically (and re-saturate the cap).
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp"
      agp:
        # Dependabot names catalog plugins by plugin id, not by the AGP Maven coordinates.
        patterns:
          - "com.android.application"
          - "com.android.library"
      detekt:
        patterns:
          - "io.gitlab.arturbosch.detekt"
          - "io.gitlab.arturbosch.detekt:*"
      # The harness configures the publishing plugin through calls compiled against its own version, so
      # both move in one PR; the catalog comment on vanniktech-mvn-publish says how to check a bump.
      harness:
        patterns:
          - "io.github.fluxo-kt.fluxo-kmp-conf*"
          - "com.vanniktech*"
      dokka:
        patterns:
          - "org.jetbrains.dokka*"

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "weekly"
    labels:
      - "gh-action"
      - "dependencies"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # All action bumps in one PR: they are reviewed together as SHA pins.
    groups:
      gh-actions:
        patterns:
          - "*"

