name: Dependency Baselines

# Dependabot cannot run Gradle, but every dependency bump moves committed baselines: the SHA-256 pins in
# `gradle/verification-metadata.xml` (strict mode refuses any artefact whose hash is not recorded, which
# defends against repository/CDN poisoning), the dependency-guard snapshots and the yarn locks. This
# workflow regenerates exactly those on Dependabot PRs and pushes them onto the PR head. API dumps are
# deliberately NOT regenerated here: an ABI change caused by a dependency must stay visible for review.
#
# Safety mirror of pr-baseline.yml: `pull_request_target` runs with base-repo permissions, and
# `--force-with-lease=ref:sha` refuses the push if the PR head moved after the trigger.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      # Only run when something has likely shifted the dependency graph.
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write
  pull-requests: write
  # A push made with GITHUB_TOKEN triggers no workflow, so CI is dispatched explicitly afterwards.
  actions: write

concurrency:
  group: verify-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    # Dependabot-only, same-repo only: humans run `./updateBaselines` locally, and force-pushing a
    # human's branch on every commit would fight them.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Regenerate dependency baselines
    # macOS: only a macOS host resolves the Apple-target artefacts; the other hosts' toolchain
    # archives are covered by the `resolveCrossHostToolchains` task inside the regen.
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Regenerate dependency baselines
        run: ./updateBaselines --deps-only

      - name: Commit, push and dispatch CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradle/verification-metadata.xml dependencies .kotlin-js-store kotlin-js-store

          if git diff --staged --quiet; then
            echo "::notice::Dependency baselines unchanged."
            exit 0
          fi

          git commit -m "build(deps): regenerate dependency baselines for Dependabot bump"

          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin "HEAD:${HEAD_REF}"

          gh workflow run build.yml --ref "${HEAD_REF}"
