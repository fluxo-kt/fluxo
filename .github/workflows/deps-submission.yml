name: Submit Gradle dependencies

on:
  push:
    # Dependabot alerts are computed from the default branch's submitted graph.
    branches: [ dev ]
    paths-ignore:
      - '**-check.yml'
      - '**-validation.yml'
      - '**.*ignore'
      - '**.api'
      - '**.kt'
      - '**.main.kts'
      - '**.md'
      - '**.pro'
      - '**.xml'
      - '**benchmark.yml'
      - '**build.yml'

permissions:
  contents: read

env:
  # gradle.properties verifies leniently for local builds; CI must override it (settings.gradle.kts enforces).
  GRADLE_OPTS: "-Dorg.gradle.dependency.verification=strict"

jobs:
  submit:
    name: Dependencies
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    permissions: # The Dependency Submission API requires write permission
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        timeout-minutes: 5
        with:
          action: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
          with: |
            cache: gradle
            distribution: temurin
            # 17: compile/test toolchain (javaLangTarget); 25 last = JAVA_HOME, the Gradle daemon JDK.
            java-version: |
              17
              25
          attempt_limit: 3
          attempt_delay: 2000

      - name: Disable configuration cache
        run: sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties

      # Gradle's own dependency-graph plugin resolves every configuration of every project. The previous
      # third-party action parsed `gradle dependencies` text and failed on every run, which left the
      # submitted graph (and so the Dependabot alerts) frozen at an old snapshot.
      - name: Submit Gradle Dependency Graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
