name: OSSF Scorecard

on:
  branch_protection_rule:
  # Weekly run keeps the SARIF fresh between commits. Tuesday 04:15 UTC matches
  # the rest of the project's scheduled-job cadence; pick a non-peak slot.
  schedule:
    - cron: '15 4 * * 2'
  push:
    branches: [main]

# Top-level least privilege; per-job permissions grant what each step needs.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF to GitHub Code Scanning.
      security-events: write
      # Required for the publish_results step to attest the SARIF via OIDC.
      id-token: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Scorecard reads `.git` history but should not authenticate as the
          # actor; persist-credentials=false prevents the GITHUB_TOKEN leaking to
          # the subsequent steps.
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true requires id-token: write (see permissions); it
          # signs the SARIF via Sigstore and pushes to the OpenSSF results bucket,
          # which the Scorecard badge then queries.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: results.sarif
