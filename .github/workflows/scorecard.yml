name: OSSF Scorecard

on:
  branch_protection_rule:
  # Weekly run keeps the SARIF fresh between commits. Tuesday 04:15 UTC matches
  # the rest of the project's scheduled-job cadence; pick a non-peak slot.
  schedule:
    - cron: '15 4 * * 2'
  push:
    # Scorecard scores the default branch.
    branches: [dev]

# Top-level least privilege; per-job permissions grant what each step needs.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF to GitHub Code Scanning.
      security-events: write
      # Required for the publish_results step to attest the SARIF via OIDC.
      id-token: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads `.git` history but should not authenticate as the
          # actor; persist-credentials=false prevents the GITHUB_TOKEN leaking to
          # the subsequent steps.
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true requires id-token: write (see permissions); it
          # signs the SARIF via Sigstore and pushes to the OpenSSF results bucket,
          # which the Scorecard badge then queries.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
