name: OSSF Scorecard

on:
  branch_protection_rule:
  # Weekly run keeps the SARIF fresh between commits. Tuesday 04:15 UTC matches
  # the rest of the project's scheduled-job cadence; pick a non-peak slot.
  schedule:
    - cron: '15 4 * * 2'
  push:
    branches: [main]

# Top-level least privilege; per-job permissions grant what each step needs.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF to GitHub Code Scanning.
      security-events: write
      # Required for the publish_results step to attest the SARIF via OIDC.
      id-token: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Scorecard reads `.git` history but should not authenticate as the
          # actor; persist-credentials=false prevents the GITHUB_TOKEN leaking to
          # the subsequent steps.
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true requires id-token: write (see permissions); it
          # signs the SARIF via Sigstore and pushes to the OpenSSF results bucket,
          # which the Scorecard badge then queries.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
