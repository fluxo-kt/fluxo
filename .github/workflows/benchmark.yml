name: Benchmark

on:
  schedule:
    - cron: '0 7 * * 2'
  push:
    paths:
      - '**/**Benchmark.kt'
      - '**/benchmark-summary.main.kts'
      - '**/benchmark.yml'

concurrency:
  # JMH runs are long; a second push to the same ref preempts the previous one
  # so we don't pay for two stale runs racing. Scheduled cron uses the default branch, so
  # cancel-in-progress also stops a manually-triggered run if cron starts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIGGER_COUNTER: 15
  JMH_THREADS: 2
  GRADLE_OPTS: "-Dorg.gradle.daemon=false \
  -Dorg.gradle.configuration-cache=false \
  -Dorg.gradle.vfs.watch=false \
  -Dorg.gradle.dependency.verification=strict \
  "

jobs:
  os-checks:
    strategy:
      fail-fast: false
      matrix:
        # TODO: Benchmark on different JDK distributions?
        #  https://www.ojalgo.org/2019/02/quick-test-to-compare-hotspot-and-openj9/
        # JMH runtime JDK: the benchmarks' javaLangTarget (comparison libraries need Java 21+).
        java: [ '25' ]
        os: [ 'macos', 'windows', 'ubuntu' ]
        benchmark: [ 'IncrementIntent.*' ]

    name: '${{ matrix.os }} JDK${{ matrix.java }} "${{ matrix.benchmark }}" benchmark'
    runs-on: '${{ matrix.os }}-latest'

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          # 17: fluxo-core's compile toolchain; matrix.java last = JAVA_HOME, the Gradle daemon and JMH JDK.
          java-version: |
            17
            ${{ matrix.java }}

      # macos runner provides more CPU cores.
      - if: matrix.os == 'macos'
        run: echo "JMH_THREADS=3" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != '25' }}

      # setup-gradle@v4+ dropped the `arguments:` input — run Gradle in a dedicated step.
      # jmh is configuration-cache-incompatible, hence the explicit `--no-configuration-cache`.
      - name: 'Benchmark "${{ matrix.benchmark }}" on ${{ matrix.os }} JDK${{ matrix.java }}'
        env:
          CI: true
          jmh: '${{ matrix.benchmark }}'
          jmh_wi: 1
          jmh_i: 6
          jmh_f: 2
          jmh_t: '${{ env.JMH_THREADS }}'
        run: ./gradlew jmh --stacktrace --no-configuration-cache --scan

      - name: Summary
        run: ./.github/workflows/benchmark-summary.main.kts >> "$GITHUB_STEP_SUMMARY"
        shell: bash
