name: Benchmark

on:
  schedule:
    - cron: '0 7 * * 2'
  push:
    paths:
      # The library code the gate guards: a slowdown must fail on the push that caused it, not at the weekly cron.
      # JMH runs on the JVM: commonMain, commonJvmMain and jvmMain are what it executes.
      - 'fluxo-core/src/common*Main/**'
      - 'fluxo-core/src/jvmMain/**'
      - 'fluxo-common/src/commonMain/**'
      - '**/**Benchmark.kt'
      - '**/benchmark-summary.main.kts'
      - '**/benchmark.yml'

concurrency:
  # JMH runs are long; a second push to the same ref preempts the previous one
  # so we don't pay for two stale runs racing. Scheduled cron uses the default branch, so
  # cancel-in-progress also stops an in-flight push run on that branch when cron starts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIGGER_COUNTER: 15
  GRADLE_OPTS: "-Dorg.gradle.daemon=false \
  -Dorg.gradle.configuration-cache=false \
  -Dorg.gradle.vfs.watch=false \
  -Dorg.gradle.dependency.verification=strict \
  "

jobs:
  os-checks:
    strategy:
      fail-fast: false
      matrix:
        # TODO: Benchmark on different JDK distributions?
        #  https://www.ojalgo.org/2019/02/quick-test-to-compare-hotspot-and-openj9/
        # JMH runtime JDK: the benchmarks' javaLangTarget (comparison libraries need Java 21+).
        java: [ '25' ]
        os: [ 'macos', 'windows', 'ubuntu' ]
        benchmark: [ 'IncrementIntent.*' ]

    name: '${{ matrix.os }} JDK${{ matrix.java }} "${{ matrix.benchmark }}" benchmark'
    runs-on: '${{ matrix.os }}-latest'
    # A healthy run takes well under this; the bound stops a hung JMH fork from holding a runner for the 6 h default.
    timeout-minutes: 120
    # Gating profile, read by the JMH run and by the summary's baseline gate, which fails when the baseline was
    # measured with another profile or JDK major. Must equal jmh-baseline-bootstrap.yml's: threads change
    # throughput; warmup changes the JIT state measured.
    env:
      jmh_wi: 2
      jmh_i: 5
      jmh_f: 2
      jmh_t: 2

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          # 17: fluxo-core's compile toolchain; matrix.java last = JAVA_HOME, the Gradle daemon and JMH JDK.
          java-version: |
            17
            ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != '25' }}

      # setup-gradle@v4+ dropped the `arguments:` input — run Gradle in a dedicated step.
      # jmh is configuration-cache-incompatible, hence the explicit `--no-configuration-cache`.
      - name: 'Benchmark "${{ matrix.benchmark }}" on ${{ matrix.os }} JDK${{ matrix.java }}'
        env:
          CI: true
          jmh: '${{ matrix.benchmark }}'
        run: ./gradlew jmh --stacktrace --no-configuration-cache --scan

      # The summary also gates fluxo's own rows against benchmarks/jmh/baselines/main-{darwin,linux}.json
      # (re-anchor with jmh-baseline-bootstrap.yml after a JDK or profile change); Windows has no baseline.
      - name: Summary
        env:
          JMH_BASELINE_CHECK: 1
        run: ./.github/workflows/benchmark-summary.main.kts >> "$GITHUB_STEP_SUMMARY"
        shell: bash
