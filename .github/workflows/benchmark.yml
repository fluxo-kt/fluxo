name: Benchmark

on:
  schedule:
    - cron: '0 7 * * 2'
  push:
    paths:
      # The library code the gate guards: a slowdown must fail on the push that caused it, not at the weekly cron.
      # JMH runs on the JVM: commonMain, commonJvmMain and jvmMain are what it executes.
      - 'fluxo-core/src/common*Main/**'
      - 'fluxo-core/src/jvmMain/**'
      - 'fluxo-common/src/commonMain/**'
      - '**/**Benchmark.kt'
      - '**/benchmark-summary.main.kts'
      - '**/benchmark.yml'

concurrency:
  # JMH runs are long; a second push to the same ref preempts the previous one
  # so we don't pay for two stale runs racing. Scheduled cron uses the default branch, so
  # cancel-in-progress also stops an in-flight push run on that branch when cron starts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more ask for it in their own permissions block.
permissions:
  contents: read

env:
  TRIGGER_COUNTER: 15
  GRADLE_OPTS: "-Dorg.gradle.daemon=false \
  -Dorg.gradle.configuration-cache=false \
  -Dorg.gradle.vfs.watch=false \
  -Dorg.gradle.dependency.verification=strict \
  "

jobs:
  os-checks:
    strategy:
      fail-fast: false
      matrix:
        # TODO: Benchmark on different JDK distributions?
        #  https://www.ojalgo.org/2019/02/quick-test-to-compare-hotspot-and-openj9/
        # JMH runtime JDK: the benchmarks' javaLangTarget (comparison libraries need Java 21+).
        java: [ '25' ]
        os: [ 'macos', 'windows', 'ubuntu' ]

    name: '${{ matrix.os }} JDK${{ matrix.java }} benchmark'
    runs-on: '${{ matrix.os }}-latest'
    # A healthy run takes well under this; the bound stops a hung JMH fork from holding a runner for the 6 h default.
    timeout-minutes: 150
    env:
      # The gate's reference: Fluxo's library sources from this commit are benchmarked on the same runner after the
      # main run. Move it to a newer commit when a slowdown is accepted, or when the benchmarks stop compiling against it.
      JMH_REFERENCE: d12c6a584c6c0194120d1564e91bf8cd622183fa
      # The rows the gate compares. A push benchmarks only these (a few of the suite's benchmarks); the weekly run adds
      # every comparison library for the summary table.
      jmh_fluxo: 'IncrementIntentBenchmark.fluxo__.*'
      jmh_wi: 2
      jmh_i: 5
      jmh_f: 2
      jmh_t: 2

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          # 17: fluxo-core's compile toolchain; matrix.java last = JAVA_HOME, the Gradle daemon and JMH JDK.
          java-version: |
            17
            ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != '25' }}

      # setup-gradle@v4+ dropped the `arguments:` input — run Gradle in a dedicated step.
      # jmh is configuration-cache-incompatible, hence the explicit `--no-configuration-cache`.
      - name: 'Benchmark'
        env:
          CI: true
          jmh: ${{ github.event_name == 'schedule' && 'IncrementIntent.*' || env.jmh_fluxo }}
        run: ./gradlew jmh --stacktrace --no-configuration-cache --scan

      # Same JMH profile and runner as the main run, Fluxo rows only, with the reference commit's library sources in
      # place: the summary compares the two, so runner hardware cancels out. Ubuntu only: on a macOS runner two passes
      # over identical library code differed by up to 81 % in both modes (run 37687829186), past any usable gate.
      - name: 'Benchmark Fluxo at the reference commit'
        if: matrix.os == 'ubuntu'
        env:
          CI: true
          jmh: ${{ env.jmh_fluxo }}
        shell: bash
        run: |
          results=benchmarks/jmh/build/results/jmh
          mv "$results/results.txt" "$RUNNER_TEMP/results-head.txt"
          # Put the main run's results back even when this step fails, so the summary still prints its table.
          trap 'mv "$RUNNER_TEMP/results-head.txt" "$results/results.txt"' EXIT
          git fetch --no-tags --depth=1 origin "$JMH_REFERENCE"
          rm -rf fluxo-core/src fluxo-common/src
          git checkout "$JMH_REFERENCE" -- fluxo-core/src fluxo-common/src
          ./gradlew jmh --stacktrace --no-configuration-cache
          mv "$results/results.txt" "$results/results-reference.txt"

      # Also after a failed reference run: the table still prints, and the gate fails on the missing reference.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          JMH_REFERENCE_CHECK: ${{ matrix.os == 'ubuntu' }}
        run: ./.github/workflows/benchmark-summary.main.kts >> "$GITHUB_STEP_SUMMARY"
        shell: bash
