name: Build

on:
  pull_request:
    paths-ignore:
      - '**-check.yml'
      - '**-submission.yml'
      - '**-validation.yml'
      - '**.*ignore'
      - '**.md'
      - '**.txt'
      - '**benchmark.yml'
      - '**dependabot.yml'
  push:
    paths-ignore:
      - '**-check.yml'
      - '**-submission.yml'
      - '**-validation.yml'
      - '**.*ignore'
      - '**.md'
      - '**.txt'
      - '**benchmark.yml'
      - '**dependabot.yml'
  # baselines.yml dispatches this after pushing regenerated baselines (a GITHUB_TOKEN push starts no normal run);
  # the `dispatched-status` job reports the result on the PR.
  workflow_dispatch:

concurrency:
  # Per-branch lane: a second push to the same ref pre-empts an in-flight build.
  # `cancel-in-progress: true` keeps CI minutes bounded for fast-iterating PRs.
  # Tags get a unique ref so release builds never race themselves.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more ask for it in their own permissions block.
permissions:
  contents: read

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  GRADLE_OPTS: "\
  -Dorg.gradle.configuration-cache=false \
  -Dorg.gradle.vfs.watch=false \
  -Dorg.gradle.dependency.verification=strict \
  "

jobs:
  commitlint:
    # Conventional-Commits enforcement on PR commits. Rules in `.commitlintrc.yml`.
    # PRs only — for direct pushes to a branch there is no incremental commit
    # range to lint, and the maintainer already reviewed the commit body.
    name: Lint commit messages
    # Dependabot's commit format (subject length, scope case, release-note bodies) is fixed and
    # machine-generated, so linting it only fails every dependency PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits through the API
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` so commitlint can see the full PR commit range.
          fetch-depth: 0

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        with:
          configFile: .commitlintrc.yml
          helpURL: https://www.conventionalcommits.org/

  os-checks:
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
        os: [ 'macos-latest', 'windows-latest', 'ubuntu-latest' ]

    name: 'Test on ${{ matrix.os }} JDK ${{ matrix.java }}'
    timeout-minutes: 55
    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    # The repository default token is read-only.
    permissions:
      contents: read
      checks: write # JUnit report check on default-branch pushes
      pull-requests: write # setup-gradle's job summary as a PR comment on failure

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          # matrix.java: compile/test toolchain; 25 last = JAVA_HOME, the Gradle daemon JDK.
          java-version: |
            ${{ matrix.java }}
            25

      - name: 'Cache Konan (Kotlin/Native compiler)'
        timeout-minutes: 6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.konan
            /Users/runner/.konan
          # runner.arch: the arm64 and Intel macOS jobs need different Kotlin/Native compilers.
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != '17' }}
          # Native replacement for the old custom build-scan PR-comment step (which referenced a
          # non-existent step id and always rendered empty). Posts the build report on PR failure.
          add-job-summary-as-pr-comment: on-failure

      - name: 'Build and check on ${{ matrix.os }} (complete, non-release)'
        id: check
        if: matrix.os != 'windows-latest'
        timeout-minutes: 50
        run: ./gradlew build assemble check --stacktrace --continue --scan

      - name: 'Build and check on ${{ matrix.os }} (split_targets, release)'
        if: matrix.os == 'windows-latest'
        timeout-minutes: 35
        env:
          RELEASE: true
        run: ./gradlew build assemble check -Dsplit_targets --stacktrace --continue --scan --no-daemon

      - name: 'Dry-run the baseline regeneration'
        # Dependabot PRs depend on this command; dry-running it on every change makes a plugin that
        # breaks it fail here instead of on the next dependency update.
        if: matrix.os == 'ubuntu-latest'
        run: ./updateBaselines --deps-only --dry-run

      - name: 'Prove every API check fails on new public API'
        # A green apiCheck cannot tell "no API change" from "this lane compares nothing"; the script plants public
        # API and requires each lane to report it. One OS is enough: every lane runs on Linux.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: ./.github/workflows/api-gate-canary.sh

      - name: Summary
        if: success() || failure()
        continue-on-error: true
        run: ./.github/workflows/summary.main.kts >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload code coverage
        if: (success() || failure()) && !contains(github.event.head_commit.message, 'coverage skip')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          OS: ${{ matrix.os }}
          JAVA_VERSION: ${{ matrix.java }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover-merged-report.xml
          env_vars: OS,JAVA_VERSION
          flags: 'unit-tests,${{ matrix.os }}'
          name: 'codecov-${{ matrix.os }}'
          fail_ci_if_error: false

      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: 'reports-${{ matrix.os }}'
          path: |
            **/build/reports/
            !**/build/reports/configuration-cache/
            !**/build/reports/dependency-analysis/

      - name: Upload merged sarif (Lint)
        # Skipped while lint and detekt are not set up; resumes by itself once the build writes the report again.
        if: (success() || failure()) && matrix.os == 'macos-latest' && hashFiles('build/lint-merged.sarif') != ''
          && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/lint-merged.sarif
          category: lint

      - name: Upload merged sarif (Detekt)
        # Skipped while lint and detekt are not set up; resumes by itself once the build writes the report again.
        if: (success() || failure()) && matrix.os == 'macos-latest' && hashFiles('build/detekt-merged.sarif') != ''
          && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      - name: Publish JUnit test results as a pull request check
        if: (success() || failure()) && matrix.os == 'macos-latest'
          && github.repository == 'fluxo-kt/fluxo' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: '**/build/test-results/*/TEST-*.xml'

      # Snapshots publish only from `main` (the release line), never from every `dev` push: a snapshot per
      # commit has no consumer, and the Central namespace must have SNAPSHOTs enabled (403 otherwise).
      - name: 'Check release API and publish SNAPSHOT'
        id: snapshot
        if: matrix.os == 'macos-latest' && matrix.java == '17'
          && steps.check.outcome == 'success'
          && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fluxo-kt/fluxo'
        env:
          # Vanniktech reads Central Portal credentials from these Gradle-property
          # env vars (ORG_GRADLE_PROJECT_*). The previous OSSRH_* names reached the
          # runner but were never read by the plugin, so snapshots never published.
          # Snapshots are published unsigned — the harness sets signing isRequired
          # only for non-snapshot versions (SetupVanniktechPublication.kt) — so no
          # signing key is needed on this path; releases sign via release.yml.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RELEASE: true
        run: ./gradlew apiCheck androidApiCheck publishToMavenCentral -DDISABLE_TESTS --rerun-tasks --stacktrace --scan

      - name: 'Check release API on ${{ matrix.os }}'
        if: matrix.os != 'windows-latest' && steps.snapshot.outcome == 'skipped'
        env:
          RELEASE: true
        run: ./gradlew apiCheck androidApiCheck --stacktrace --scan

  apple-x64-tests:
    # fluxo publishes iosX64, macosX64, tvosX64 and watchosX64 artefacts, but KGP runs a native test only on a host
    # of the same architecture, so the arm64 macos-latest job compiles these targets and skips their tests. This job
    # runs just those tests on an Intel runner. Drop a target here when the root build drops it (Kotlin 2.5 removes
    # all but iosX64); drop the job when no x64 Apple target is left.
    name: Test x64 Apple targets
    timeout-minutes: 55
    runs-on: macos-26-intel
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    permissions:
      contents: read
    env:
      X64_TESTS: iosX64Test macosX64Test tvosX64Test watchosX64Test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          # 17: compile/test toolchain (javaLangTarget); 25 last = JAVA_HOME, the Gradle daemon JDK.
          java-version: |
            17
            25

      - name: 'Cache Konan (Kotlin/Native compiler)'
        timeout-minutes: 6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /Users/runner/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run the x64 Apple tests
        run: |
          # shellcheck disable=SC2086 # X64_TESTS is a list of task names, split on purpose
          ./gradlew $X64_TESTS --stacktrace --continue

      - name: Fail if an x64 test task ran no tests
        # fluxo-kmp-conf skips a simulator test task when the image has no runtime for it, and a skipped task is
        # green; every module with tests must leave JUnit results for every task.
        run: |
          missing=0
          for module in fluxo-core fluxo-data; do
            for task in $X64_TESTS; do
              if ! ls "$module/build/test-results/$task"/TEST-*.xml > /dev/null 2>&1; then
                echo "::error::$module:$task left no test results (skipped, or no tests ran)"
                missing=1
              fi
            done
          done
          exit "$missing"

  dispatched-status:
    # A dispatched run (baselines.yml after its push) is not linked to the PR, so the PR checks would never show
    # it; report the result as a commit status, which the PR does show.
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [ os-checks, apple-x64-tests ]
    name: Report dispatched build status
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.os-checks.result == 'success' && needs.apple-x64-tests.result == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state="$STATE" -f context="Build (dispatched)" -f target_url="$URL"
