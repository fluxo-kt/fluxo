name: Actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        id: get_actionlint
        # rhysd/actionlint v1.7.12 — official downloader script pinned at the tag's
        # commit SHA. The script prints the binary path on stdout (read into
        # ::set-output), so the next step can invoke it directly without PATH munging.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          echo "executable=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Run actionlint
        # `-color` keeps the output readable in the Actions log. shellcheck lints every `run:` script (quoting and
        # word-splitting bugs); actionlint silently skips it, exit 0, when the binary is missing, so assert it first.
        run: |
          shellcheck --version
          ${{ steps.get_actionlint.outputs.executable }} -color -shellcheck=shellcheck
        shell: bash
