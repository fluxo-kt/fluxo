# Gradle daemon JVM criteria (written by hand: `updateDaemonJvm` in Gradle 9 requires toolchain download
# repositories, and this build disables toolchain auto-download). KSP processors load in the daemon and
# visualfsm-compiler 4 is Java 21 bytecode, so the floor is 21; 25 is the newest LTS that satisfies it.
toolchainVersion=25
