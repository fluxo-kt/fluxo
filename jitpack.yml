# JitPack builds fluxo from any commit on request, for consumers who need unreleased code: add the
# https://jitpack.io repository and depend on com.github.fluxo-kt.fluxo:<module>:<commit>. Releases and snapshots
# are published to Maven Central; root build.gradle.kts switches to JitPack's coordinates when JITPACK=true.
jdk:
  # Runs the Gradle launcher (Gradle 9 needs 17+) and is the JVM toolchain the libraries compile against.
  - openjdk17
before_install:
  # The Gradle daemon runs on JDK 21 here, not on the JDK 25 that gradle/gradle-daemon-jvm.properties asks for.
  # JitPack's container sandbox answers the statx syscall with EPERM (instead of ENOSYS, which the JDK would treat
  # as "fall back"), and JDK 25 then cannot load classes from jars, starting with the Gradle daemon's own
  # instrumentation agent (ClassNotFoundException: org.gradle.instrumentation.agent.Agent). JDK 17 and 21 do not use
  # statx. 21 is the floor: KSP processors load in the daemon and need Java 21 bytecode.
  # Adoptium's "latest" endpoint has no patch version to go stale; Gradle auto-detects JDKs in the SDKMAN folder.
  # The download is trusted on TLS, and gzip's CRC rejects a truncated archive.
  - mkdir -p ~/.sdkman/candidates/java/21-tem && curl -fsSL https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse | tar -xz --strip-components=1 -C ~/.sdkman/candidates/java/21-tem
  - sed -i 's/^toolchainVersion=.*/toolchainVersion=21/' gradle/gradle-daemon-jvm.properties
install:
  # Strict dependency verification, as for every published artefact (local builds only warn). Kotlin cross-compiles
  # the Apple klibs on Linux (no cinterop here), so the publication covers every target.
  - ./gradlew publishToMavenLocal -Dorg.gradle.dependency.verification=strict --console=plain
