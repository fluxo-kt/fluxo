# TEMPORARY diagnostic build: isolates why the Gradle 9.8 daemon's instrumentation agent fails on JitPack's JDK 25.
jdk:
  - openjdk17
before_install:
  - uname -a; id; echo "JTO=$JAVA_TOOL_OPTIONS JO=$_JAVA_OPTIONS JDKO=$JDK_JAVA_OPTIONS LANG=$LANG LC_ALL=$LC_ALL"
  - mkdir -p ~/.sdkman/candidates/java/25-tem
  - curl -fsSL https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse | tar -xz --strip-components=1 -C ~/.sdkman/candidates/java/25-tem; echo "tar-rc=$?"
  - J25=~/.sdkman/candidates/java/25-tem/bin/java; file $J25; $J25 -version; java -version
  - ./gradlew --version --no-daemon
  - A=$(ls ~/.gradle/wrapper/dists/gradle-9.8.0-bin/*/gradle-9.8.0/lib/agents/gradle-instrumentation-agent-9.8.0.jar); M=${A%/agents/*}/gradle-daemon-main-9.8.0.jar; ls -la $A $M; sha256sum $A $M; jar tf $A | head -5; unzip -p $A META-INF/MANIFEST.MF
  - echo P1-25-agent-cp; $J25 -javaagent:$A -cp $M -version; echo "rc=$?"
  - echo P2-25-agent-cp-noJTO; env -u JAVA_TOOL_OPTIONS $J25 -javaagent:$A -cp $M -version; echo "rc=$?"
  - echo P3-25-agent-only; $J25 -javaagent:$A -version; echo "rc=$?"
  - echo P4-17-agent-cp; java -javaagent:$A -cp $M -version; echo "rc=$?"
  - echo P5-25-Xshare-off; $J25 -Xshare:off -javaagent:$A -cp $M -version; echo "rc=$?"
  - echo P6-25-copied-jar; cp $A /tmp/agent.jar; $J25 -javaagent:/tmp/agent.jar -version; echo "rc=$?"
install:
  - echo diagnostics-only
